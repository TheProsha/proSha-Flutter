# .gitlab-ci.yml for Flutter project CI
# Place this file at the root of your repository

stages:
  - test

flutter_test:
  stage: test
  # image: cirrusci/flutter:3.19.6      # Use a valid Flutter Docker image; change '3.19.6' as needed
  image: ghcr.io/cirruslabs/flutter:main      # Use the latest Flutter & Dart SDK (>=3.6.0)
  script:
    - flutter pub get
    - flutter test
  only:
    - branches
    - merge_requests

# You can expand this file to include more jobs for build, lint, deploy, etc.
